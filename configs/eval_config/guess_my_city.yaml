verbose: 0
debug: false
elogger: false # Whether to activate email logging
host_sglang: false  # Whether to host the sglang server through code for the agents
local_sglang: false # If true, will save the model in the local directory (get around the bug: https://github.com/vllm-project/vllm/issues/2675)
sim_host: localhost  # The host for the environment simulator's SGLang server (the env must be on the same machine)
sim_port: 40042  # The port number for the environment simulator's SGLang server (the env must be on the same machine)
iter: 0
mode: consolidate_online # online, consolidate_online
logdir: data/guess_my_city/eval
rollout_data_dir: data/guess_my_city/eval/baseline/gpt4o
offline_data_dir: data/guess_my_city/sft/
data_types:
  - val
online:
  rollout_per_task_range_min: 0  # Inclusive
  rollout_per_task_range_max: 10  # Non-inclusive
  batch_size: 32
  num_alt_responses: 5
consolidate_online:
  main_table_notes: null
  table_notes: 'placeholder'
  normalize: false
  rollout_per_task_dict:
    train: 1
    val: 3
    test: 3
  use_existing_table: false
  overwrite_existing_entry: true
agents:
  - type: gpt4o_expert
    log_name: gpt4o
  - type: sglang_server
    log_name: 3B
    model_id: meta-llama/Llama-3.2-3B-Instruct
    prompt_template_file: prompts/guess_my_city/guess_my_city_template.j2
    server_url: http://localhost:TODO/
    dist_url_port: null
    temperature: 0.3
    batch_limit: 32
    verbose: 3
  ########################################################################################## Example of SGLang server to evaluate a policy
  - type: sglang_server
    log_name: pi0
    model_id: REDACTED
    prompt_template_file: prompts/guess_my_city/guess_my_city_template.j2
    server_url: http://localhost:TODO/
    dist_url_port: null
    temperature: 0.3
    batch_limit: 32
    verbose: 3
  ########################################################################################## Example of Best of N to evaluate a critic
  - type: best_of_n
    log_name: BoN_pi0_Q0
    num_generations: 15 # Best of N (The critic will pick the best out of N responses)
    generator:
      type: sglang_server
      model_id: REDACTED
      prompt_template_file: prompts/guess_my_city/guess_my_city_template.j2
      server_url: http://localhost:TODO/
      temperature: 0.7
      batch_limit: 32
      dist_url_port: null
    critic:
      type: sglang_server
      model_id: REDACTED
      prompt_template_file: prompts/guess_my_city/guess_my_city_template.j2
      server_url: http://localhost:TODO/
      temperature: 0.3
      batch_limit: 16
      dist_url_port: null
    verbose: 3

defaults:
  - _self_

hydra:
  run:
    dir: ${logdir}/iter${iter}/_hydra/${mode}/${now:%Y-%m-%d-%H%M%S%f}