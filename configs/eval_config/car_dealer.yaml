verbose: 0
debug: false
elogger: false # Whether to activate email logging
host_sglang: false  # Whether to host the sglang server through code for the agents
local_sglang: false # If true, will save the model in the local directory (get around the bug: https://github.com/vllm-project/vllm/issues/2675)
sim_host: localhost  # The host for the environment simulator's SGLang server (the env must be on the same machine)
sim_port: 40042  # The port number for the environment simulator's SGLang server (the env must be on the same machine)
iter: 0
mode: offline # offline or online
logdir: data/car_dealer/eval
data_types:
  - val
online:
  rollout_per_task_range_min: 0  # Inclusive
  rollout_per_task_range_max: 10  # Non-inclusive
  batch_size: 32
  num_alt_responses: 5
consolidate_online:
  main_table_notes: null
  table_notes: 'placeholder'
  rollout_per_task_dict:
    train: 1
    val: 3
    test: 3
  use_existing_table: true
  overwrite_existing_entry: false
