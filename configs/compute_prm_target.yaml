  #   - 4
  #   - 12
  #   - 24
  #   - 32
  onpolicy_pct_for_success: null # Within the successful on-policy rollouts, only X pct of files are from on-policy rollouts
  num_failed_expert_rollouts_to_include: 0 # Only used in hindsight cases. Include X number of failed expert rollouts
  track_offpolicy: true # Whether to track the off-policy rollouts
  use_past_onpolicy_failed_rollouts: false # Whether to use the old on-policy failed rollouts
  ############################################################### For car dealer
  past_onpolicy_rolloutdirs:
    - /share/portal/hw575/agent_prm/data/car_dealer/eval/iter0/hindsight_pi0-62pct_max-car-8_250504_061410_iter0-max-car-8_pi0_vanilla_max-car-8_epochs=3
