  ############ 10k data ############
  iter1:
    # pi1-21pct_multi-star_from-base-3B_1epoch_10k-data
    rollout_dir: /share/portal/hw575/agent_prm/data/twenty_questions/eval/iter1/pi1-21pct_multi-star_from-base-3B_1epoch_10k-data_250428_232930_iter1_multi-star_10k_pi1_multi-star_from-base_10k-data_epochs=1
  iter2:
    # iter2 (to train pi3): pi2-21pct_multi-star_from-base-3B_1epoch_10k-data
    rollout_dir: /share/portal/hw575/agent_prm/data/twenty_questions/eval/iter2/pi2-21pct_multi-star_from-base-3B_1epoch_10k-data_250429_132535_iter2_multi-star_10k_pi2_multi-star_from-base_10k-data_epochs=1